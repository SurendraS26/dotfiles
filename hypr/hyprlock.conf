$font = Monospace
$PAMFAIL = Monkey Don't Know Password ?
$placeholder = God is Great
$remember = "I Know You Care for me"

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    blur_passes = 0
}

input-field {
    monitor = eDP-1
    size = 20%, 4%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgb(124, 77, 255) rgb(216, 27, 96) 45deg
    check_color = rgb(216, 27, 96) rgb(124, 77, 255) 180deg
    fail_color = rgb(255, 214, 0) rgb(236, 1, 1) 40deg

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = $placeholder
    fail_text = $PAMFAIL


    # dots_text_format = * 
    # dots_size = 0.4
    dots_spacing = 0.3

    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# REMEMBER

label {
    monitor =
    text = $remember
    font_size = 10
    font_family = $font
    position = 0, 0
    halign = center
    valign = bottom
}

# TIME
label {
    monitor =
    text = $TIME 
    font_size = 50
    font_family = $font

    position = 0, -370
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, -470
    halign = center
    valign = top
}

